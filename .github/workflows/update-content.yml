name: Update AI Research Feed

on:
  schedule:
    - cron: "17 */4 * * *"  # every 4 hours
  workflow_dispatch:
  push:
    paths:
      - "sources.json"
      - "scripts/fetch_content.py"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch papers, blogs, and videos
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/fetch_content.py

      - name: Commit refreshed feed
        run: |
          if git diff --quiet data/feed.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "ai-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git commit -m "chore: refresh AI/ML feed"
          git push
